  .app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--sky);position:relative;display:flex;flex-direction:column}

 <label class="lbl">${t.serviceType}</label>
 <div class="radio">
  <button class="${f.svc==="pd"?"on":""}" onclick="S.req.svc='pd';render()">🛵 ${t.svcPD}<br><span style="font-weight:500;font-size:10.5px">${t.svcPDd}</span></button>

  <button class="${f.svc==="drop"?"on":""}" onclick="S.req.svc='drop';render()">🚶 ${t.svcDrop}<br><span style="font-weight:500;font-size:10.5px">${t.svcDropd}</span></button></div>
 ${f.svc!=="drop"?`<label class="lbl" style="margin-top:12px">${t.address}</label><input value="${esc(f.address)}" placeholder="${t.addrPh}" oninput="S.req.address=this.value">

 <div><label class="lbl">${t.pickupSlot}</label><select onchange="S.req.slot=this.value">${["8:00 – 10:00","10:00 – 12:00","14:00 – 16:00","16:00 – 18:00"].map(x=>`<option ${f.slot===x?"selected":""}>${x}</option>`).join("")}</select></div></div>`:

 <label class="lbl" style="margin-top:12px">${t.garments}</label>
 <div class="card">${GARMENTS.filter(g=>s.prices[g.id]).map(g=>`<div class="itemrow"><div><div style="font-size:14px;font-weight:600">${esc(g.name[S.lang])}</div><div class="muted">${TZS(s.prices[g.id])}</div></div>${stepper(f.qty,g.id,"reqQty")}</div>`).join("")}</div>
 ${s.express?`<label class="row" style="margin-top:10px;font-size:14px"><input type="checkbox" style="width:auto" ${f.express?"checked":""} onchange="S.req.express=this.checked;render()"> ⚡ ${t.express} (+50%)</label>`:""}
 <label class="lbl" style="margin-top:10px">${t.note}</label><input value="${esc(f.note)}" placeholder="${t.notePh}" oninput="S.req.note=this.value">

  <div class="kv"><span class="muted">${t.subtotal}${f.express?" + express":""}</span><span>${TZS(subX)}</span></div>
  <div class="kv"><span class="muted">${t.delivery}</span><span>${del===0?t.free:TZS(del)}</span></div>
  <div class="kv"><b>${t.total}</b><b>${TZS(tot)}</b></div></div>
 <p class="muted" style="margin:8px 0">💳 ${t.payLater}</p>
 <button class="btn btn-blue" ${ok?"":"disabled"} onclick="sendReq()">${t.sendReq}</button>`;
}

function customerApp(){
 const t=T();
 let body=S.ctab==="find"?(S.cview==="detail"?shopDetail():S.cview==="request"?requestScreen():findScreen()):S.ctab==="track"?trackScreen():inboxScreen();
 return `<div class="strip">${Object.entries(t.ctabs).map(([id,l])=>`<button class="${S.ctab===id?"on":""}" onclick="S.ctab='${id}';S.reqMsg=false;render()">${l}</button>`).join("")}</div>${body}`;

// ─── BUSINESS ────────────────────────────────────────────────────
const mine=()=>S.orders.filter(o=>o.shop===MY_SHOP);
function tagCard(o){const t=T(),done=o.stage==="done";
 return `<div class="tagcard"><div class="hole"></div><div class="top"><div style="min-width:0"><div class="oid mono">${o.id}</div><b>${esc(o.customer)}</b><div class="muted">${esc(o.placed)}${o.svc==="pd"?" · 🛵":o.svc==="drop"?" · 🚶→🛵":""}</div></div>
 <div style="text-align:right;flex:none"><div class="price">${TZS(total(o))}</div><div class="row" style="justify-content:flex-end;margin-top:3px;gap:4px">${o.express?`<span class="pill" style="background:var(--coral);color:#fff">EXPRESS</span>`:""}${paidPill(o)}</div></div></div>
 <div class="perf"></div><div class="bot"><div class="muted">${esc(itemsTxt(o))}</div>
 <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><select style="width:auto;font-size:12px;padding:5px 7px" onchange="assign('${o.id}',this.value)"><option value="">${t.unassigned}</option>${STAFF.map(s=>`<option ${o.staff===s?"selected":""}>${s}</option>`).join("")}</select>
 <div class="row" style="gap:5px"><button class="pill" style="border:1px solid var(--blue);color:var(--blue)" onclick="S.showTag['${o.id}']=!S.showTag['${o.id}'];render()">⧉ ${t.tag}</button>${pill(o.stage)}${done?"":`<button class="pill" style="background:var(--blue);color:#fff" onclick="advance('${o.id}')">${o.stage==="requested"?t.accept:t.next}</button>`}</div></div>
 ${S.showTag[o.id]?qrHtml(o):""}</div></div>`}
function bizDash(){const t=T(),os=mine(),sh=shopBy(MY_SHOP);
 const active=os.filter(o=>o.stage!=="done"),rev=os.filter(o=>o.placed.startsWith("Leo")||o.placed===t.justNow).reduce((s,o)=>s+total(o),0),gc=os.reduce((s,o)=>s+(o.items||[]).reduce((a,i)=>a+i.qty,0),0);
 const reqs=os.filter(o=>o.stage==="requested");const n=os.filter(o=>!["done","requested","booked"].includes(o.stage)).length,load=Math.min(100,Math.round(n/sh.machines*100));
 return `<div class="grid3">${[[t.activeOrders,active.length],[t.garmentsIn,gc],[t.revenue,TZS(rev).replace("TZS ","")]].map(([l,v])=>`<div class="card stat"><b>${v}</b><small>${l}</small></div>`).join("")}</div>
 <div class="sec-title">🔔 ${t.newReq} (${reqs.length})</div>
 ${reqs.map(o=>`<div class="card" style="padding:10px 12px;margin-bottom:8px;border-color:#F3C4BB;background:#FFF7F5"><div class="row" style="justify-content:space-between"><div><b style="font-size:13px">${esc(o.customer)}</b> <span class="oid mono">${o.id}</span><div class="muted">${esc(itemsTxt(o))} · ${TZS(total(o))}</div><div class="muted">📍 ${esc(o.address)} · ${o.dist} km${o.note?" · 📝 "+esc(o.note):""}</div></div><button class="pill" style="background:var(--green);color:#fff;padding:8px 12px" onclick="setStage('${o.id}','booked')">✓ ${t.accept}</button></div></div>`).join("")||`<p class="muted">—</p>`}
 <div class="sec-title">${t.branchLoad}</div><div class="card" style="padding:12px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${sh.name}</b><span class="muted">${n} ${t.active} · ${sh.machines} ${t.machines}</span></div><div class="loadbar"><i class="${load>70?"hot":""}" style="width:${load}%"></i></div></div>
 <div class="sec-title">${t.expressA}</div>${os.filter(o=>o.express&&o.stage!=="done").map(o=>`<div class="card row" style="justify-content:space-between;padding:10px 12px;margin-bottom:8px"><b style="font-size:13px">${o.id} · ${esc(o.customer)}</b>${pill(o.stage)}</div>`).join("")||`<p class="muted">—</p>`}`}
function bizOrders(){const t=T(),f=S.filt,list=mine().filter(o=>f.stage==="all"||o.stage===f.stage);
 return `<select style="margin-bottom:10px" onchange="S.filt.stage=this.value;render()"><option value="all">${t.allStages}</option>${STAGES.map(s=>`<option value="${s}" ${f.stage===s?"selected":""}>${SLBL[S.lang][s]}</option>`).join("")}</select>
 <button class="btn btn-navy" style="margin-bottom:12px" onclick="S.creating=true;render()">${t.newOrder}</button>${list.length?list.map(tagCard).join(""):`<p class="muted" style="text-align:center;padding:24px 0">${t.noMatch}</p>`}`}
function pos(){const t=T(),f=S.pos,sh=shopBy(MY_SHOP),items=Object.entries(f.qty).filter(([,q])=>q>0).map(([g,qty])=>({g,qty})),tot=total({shop:MY_SHOP,items,kg:f.kg,express:f.express,svc:"po"}),valid=f.customer.trim()&&(items.length||f.kg>0);
 return `<h2 style="font-size:18px;margin-bottom:12px">${t.newOrder.replace("+ ","")}</h2><label class="lbl">${t.customerName}</label><input value="${esc(f.customer)}" placeholder="${t.fullName}" oninput="S.pos.customer=this.value">
 <label class="lbl" style="margin-top:10px">${t.phone}</label><input value="${esc(f.phone)}" placeholder="07xx xxx xxx" oninput="S.pos.phone=this.value">
 <label class="lbl" style="margin-top:10px">${t.garments}</label><div class="card">${GARMENTS.filter(g=>sh.prices[g.id]).map(g=>`<div class="itemrow"><div><div style="font-size:14px;font-weight:600">${esc(g.name[S.lang])}</div><div class="muted">${TZS(sh.prices[g.id])}</div></div>${stepper(f.qty,g.id,"posQty")}</div>`).join("")}</div>
 <label class="lbl" style="margin-top:10px">${t.orKg} (${TZS(S.rules.perKg)}/${t.kg})</label><input type="number" min="0" value="${f.kg||""}" onchange="S.pos.kg=Number(this.value)||0;render()">
 <label class="row" style="margin-top:10px;font-size:14px"><input type="checkbox" style="width:auto" ${f.express?"checked":""} onchange="S.pos.express=this.checked;render()"> ${t.expressSvc} (+${S.rules.expressPct}%)</label>
 <div class="card row" style="justify-content:space-between;padding:10px 12px;margin-top:12px"><span class="muted">${t.total}</span><b>${TZS(tot)}</b></div>
 <div class="grid2" style="margin-top:10px"><button class="btn btn-ghost" onclick="S.creating=false;render()">${t.cancel}</button><button class="btn btn-blue" ${valid?"":"disabled"} onclick="savePos()">${t.createOrder}</button></div>`}
function shop(){const t=T(),sub=S.ssub,sh=shopBy(MY_SHOP);let body="";
 if(sub==="profile")body=`<div class="sec-title" style="margin-top:0">${t.profile}</div>${shopCard(sh).replace('onclick="S.selShop=\'s1\';S.cview=\'detail\';render()"','')}
  <div class="card" style="padding:12px;margin-top:6px"><label class="row" style="font-size:13px"><input type="checkbox" style="width:auto" checked> ${t.visible}</label>
  <label class="lbl" style="margin-top:10px">${t.hours}</label><input value="${sh.hours}" onchange="shopBy('s1').hours=this.value;render()">
  <label class="lbl" style="margin-top:10px">${t.delivFeeLbl}</label><input type="number" value="${sh.delivFee}" onchange="shopBy('s1').delivFee=Number(this.value)||0;render()">
  <label class="row" style="margin-top:10px;font-size:13px"><input type="checkbox" style="width:auto" ${sh.express?"checked":""} onchange="shopBy('s1').express=this.checked;render()"> ⚡ Express</label>
  <label class="row" style="margin-top:6px;font-size:13px"><input type="checkbox" style="width:auto" ${sh.open?"checked":""} onchange="shopBy('s1').open=this.checked;render()"> ${t.open}</label></div>`;
 if(sub==="inv")body=`<div class="sec-title" style="margin-top:0">${t.inventory}</div>`+S.inventory.map(it=>`<div class="card row" style="justify-content:space-between;padding:10px 12px;margin-bottom:8px"><div><div style="font-size:14px;font-weight:600">${it.name[S.lang]}</div>${it.stock<=it.low?`<div class="warn">⚠ ${t.lowStock}</div>`:""}</div><div class="step"><button class="minus" onclick="invAdj('${it.id}',-1)">−</button><span style="width:30px">${it.stock}</span><button class="plus" onclick="invAdj('${it.id}',1)">+</button></div></div>`).join("");
 if(sub==="price")body=`<div class="sec-title" style="margin-top:0">${t.priceRules}</div><div class="grid2"><div><label class="lbl">${t.perKg}</label><input type="number" value="${S.rules.perKg}" onchange="S.rules.perKg=Number(this.value)||0;render()"></div><div><label class="lbl">${t.expressPct}</label><input type="number" value="${S.rules.expressPct}" onchange="S.rules.expressPct=Number(this.value)||0;render()"></div></div>
  <label class="lbl" style="margin-top:12px">${t.perItem}</label>${GARMENTS.map(g=>`<div class="card row" style="justify-content:space-between;padding:9px 12px;margin-bottom:7px"><span style="font-size:14px;font-weight:600">${esc(g.name[S.lang])}</span><span class="row" style="gap:4px"><span class="muted">TZS</span><input type="number" value="${sh.prices[g.id]||0}" style="width:84px;text-align:right;padding:5px 8px" onchange="shopBy('s1').prices['${g.id}']=Number(this.value)||0;render()"></span></div>`).join("")}
  <div class="card" style="border-style:dashed;padding:12px;margin-top:8px"><label class="lbl">${t.addGarment}</label><div class="row"><input placeholder="${t.addPh}" value="${esc(S.newG.name)}" oninput="S.newG.name=this.value"><input type="number" placeholder="TZS" value="${esc(S.newG.price)}" style="width:90px" oninput="S.newG.price=this.value"><button class="pill" style="background:var(--blue);color:#fff;padding:8px 14px" onclick="addGarment()">${t.add}</button></div></div>`;
 if(sub==="cust"){const m={};mine().forEach(o=>{if(!m[o.customer])m[o.customer]={n:o.customer,p:o.phone,c:0,sp:0};m[o.customer].c++;m[o.customer].sp+=total(o)});body=`<div class="sec-title" style="margin-top:0">${t.customers}</div>`+Object.values(m).sort((a,b)=>b.sp-a.sp).map(c=>`<div class="card row" style="justify-content:space-between;padding:10px 12px;margin-bottom:8px"><div><b style="font-size:14px">${esc(c.n)}</b><div class="muted">${esc(c.p||t.noPhone)}</div></div><div style="text-align:right"><b style="font-size:13px">${TZS(c.sp)}</b><div class="muted">${c.c} ${t.ordersW}</div></div></div>`).join("")}
 return `<div class="strip">${Object.entries(t.shopSub).map(([id,l])=>`<button class="${sub===id?"on":""}" onclick="S.ssub='${id}';render()">${l}</button>`).join("")}</div>${body}`}
function analytics(){const t=T(),os=mine(),sh=shopBy(MY_SHOP);const todayRev=os.filter(o=>o.placed.startsWith("Leo")||o.placed===t.justNow).reduce((s,o)=>s+total(o),0);const days=[...REV,todayRev],max=Math.max(...days,1),labels=["J-6","J-5","J-4","J-3","J-2","Jana","Leo"];
 const util=Math.round(os.filter(o=>["washing","drying"].includes(o.stage)).length/sh.machines*100);const cc={};os.forEach(o=>cc[o.customer]=(cc[o.customer]||0)+1);const names=Object.keys(cc),rep=names.length?Math.round(names.filter(n=>cc[n]>1).length/names.length*100):0;const avg=os.length?Math.round(os.reduce((s,o)=>s+total(o),0)/os.length):0;
 return `<h2 style="font-size:18px;margin-bottom:12px">${t.stats}</h2><div class="card" style="padding:12px"><b style="font-size:14px">${t.rev7}</b><div class="chart" style="margin-top:10px">${days.map((v,i)=>`<div class="bcol"><div class="bar ${i===6?"today":""}" style="height:${Math.max(4,v/max*100)}%"></div><small>${labels[i]}</small></div>`).join("")}</div></div>
 <div class="grid3" style="margin-top:10px"><div class="card stat"><b>${util}%</b><small>${t.machineUtil}</small></div><div class="card stat"><b>${rep}%</b><small>${t.repeat}</small></div><div class="card stat"><b style="font-size:13px;margin-top:4px">${TZS(avg).replace("TZS ","")}</b><small>${t.avgOrder}</small></div></div>`}
function account(){const t=T(),sh=shopBy(MY_SHOP);return `<h2 style="font-size:18px;margin-bottom:12px">${t.account}</h2><div class="card" style="padding:14px;margin-bottom:10px"><b>${sh.name}</b><div class="muted" style="font-size:13px;margin-top:3px">${t.owner}: Halima Juma · ${sh.area}</div></div>
 <div class="card" style="padding:14px;border-color:var(--blue)"><div style="font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase">${t.plan}</div><div class="row" style="justify-content:space-between;margin-top:4px"><b>Biashara</b><span style="font-size:13px">${TZS(25000)} ${t.perMonth}</span></div><div class="muted" style="margin-top:4px">${t.nextBilling}</div><div style="color:var(--green);font-size:12px;font-weight:700;margin-top:4px">✓ ${t.feePaid}</div></div>
 <button class="btn btn-ghost" style="margin-top:12px" onclick="S.view='landing';render()">${t.logout}</button>`}

// ─── DRIVER ──────────────────────────────────────────────────────
function driverApp(){const t=T();const pick=S.orders.filter(o=>o.stage==="booked"&&o.svc!=="drop").sort((a,b)=>a.dist-b.dist),del=S.orders.filter(o=>o.svc!=="po"&&["ready","out"].includes(o.stage)).sort((a,b)=>a.dist-b.dist);
 const task=(o,type,i)=>{const sh=shopBy(o.shop);return `<div class="card task"><div class="stopnum">${i+1}</div><div style="flex:1;min-width:0"><b style="font-size:13px">${esc(o.customer)}</b> <span class="oid mono">${o.id}</span><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(o.address||"—")} · ${o.dist} km · ${type==="p"?"→":"←"} ${sh.name}</div>${pill(o.stage)}</div>
  ${type==="p"?`<button class="pill" style="background:var(--blue);color:#fff;padding:9px 10px" onclick="setStage('${o.id}','received')">${t.pickedUp}</button>`:`<button class="pill" style="background:var(--blue);color:#fff;padding:9px 10px" onclick="setStage('${o.id}','${o.stage==="ready"?"out":"done"}')">${o.stage==="ready"?"🚚":t.delivered}</button>`}</div>`};
 return `<h2 style="font-size:18px;margin-bottom:4px">${t.driver}</h2><p class="muted" style="margin-bottom:10px">${t.routeNote}</p><div class="sec-title">📥 ${t.pickups}</div>${pick.length?pick.map((o,i)=>task(o,"p",i)).join(""):`<p class="muted">${t.noTasks}</p>`}<div class="sec-title">📤 ${t.deliveries}</div>${del.length?del.map((o,i)=>task(o,"d",i)).join(""):`<p class="muted">${t.noTasks}</p>`}`}

// ─── Root ────────────────────────────────────────────────────────
const ICONS={dash:"◧",orders:"⬡",shop:"⌂",stats:"▤",account:"☰"};
function render(){const app=document.getElementById("app"),t=T();
 if(S.view==="landing"){app.innerHTML=landing();window.scrollTo(0,0);return}
 let body,nav="";
 if(S.role==="cust")body=`<main class="nopad">${customerApp()}</main>`;
 else if(S.role==="driver")body=`<main class="nopad">${driverApp()}</main>`;
 else{const scr=S.creating?pos():S.tab==="dash"?bizDash():S.tab==="orders"?bizOrders():S.tab==="shop"?shop():S.tab==="stats"?analytics():account();body=`<main>${scr}</main>`;
  nav=`<nav class="bottom">${["dash","orders","shop","stats","account"].map(id=>`<button class="${S.tab===id&&!S.creating?"on":""}" onclick="S.creating=false;S.tab='${id}';render()"><div class="ic">${ICONS[id]}</div><small>${t.tabs[id]}</small></button>`).join("")}</nav>`}
 app.innerHTML=header()+body+nav;
}
render();
</script>
