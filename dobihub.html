<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DobiHub — Jukwaa la Dobi Tanzania</title>
<style>
  :root{
    --navy:#0B2447;        /* deep harbour night */
    --blue:#1D6FE0;        /* primary DobiHub blue */
    --blue-dark:#144FA6;
    --sky:#EAF2FD;         /* light background */
    --cyan:#7EB8FF;
    --coral:#E8604C;       /* express / warnings */
    --ink:#0B2447;
    --slate:#5B6B80;
    --line:#D7E3F4;
    --white:#FFFFFF;
    --green:#1B9E6B;
    --rose:#D64560;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;background:#CFE0F5;color:var(--ink)}
  .app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--sky);position:relative;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--white);width:100%;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .lbl{display:block;font-size:11px;font-weight:700;color:var(--slate);margin-bottom:4px}
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px}
  .btn{display:block;width:100%;padding:11px;border-radius:10px;font-weight:700;font-size:14px;text-align:center}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-ghost{border:1px solid var(--line);color:var(--slate);background:var(--white)}
  .btn[disabled]{background:#B9C6D8;color:#fff;cursor:not-allowed}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .row{display:flex;align-items:center;gap:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);margin:14px 0 8px}
  .muted{color:var(--slate);font-size:12px}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}

  /* ── Header ── */
  .hdr{background:var(--navy);color:#fff;padding:18px 16px 14px;border-radius:0 0 20px 20px}
  .hdr .tag{font-size:10px;letter-spacing:.25em;color:var(--cyan);font-weight:700}
  .hdr h1{font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:10px;font-weight:800;border:1px solid rgba(255,255,255,.35);color:#fff;padding:4px 9px;border-radius:99px}
  .lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:99px;overflow:hidden}
  .lang.light{border-color:var(--line)}
  .lang button{font-size:10px;font-weight:800;padding:4px 10px;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .lang.light button{color:var(--slate)}
  .lang button.on{background:var(--blue);color:#fff}

  /* ── Hero (Dar es Salaam) ── */
  .hero{position:relative;background:linear-gradient(180deg,#0B2447 0%,#144FA6 45%,#1D6FE0 78%,#7EB8FF 100%);color:#fff;overflow:hidden;padding:44px 24px 0}
  .hero .brand{font-size:38px;font-weight:900;letter-spacing:-.02em}
  .hero .brand span{color:var(--cyan)}
  .hero p{margin-top:10px;font-size:14px;line-height:1.55;color:#DCE9FB;max-width:34ch}
  .hero .flat{margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(126,184,255,.5);border-radius:10px;padding:9px 12px;font-size:13px;color:#EAF2FD}
  .hero .city{font-size:11px;letter-spacing:.3em;font-weight:700;color:var(--cyan);margin-top:22px;text-align:center}
  .skyline{display:block;width:100%;margin-top:6px}
  .sheet{background:var(--sky);border-radius:24px 24px 0 0;padding:22px 20px 40px;margin-top:-6px;position:relative;z-index:2}
  .role{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .role:active{border-color:var(--blue)}
  .role .ic{font-size:24px}
  .role b{display:block;font-size:15px}
  .role small{color:var(--slate);font-size:12px}
  .role .arrow{margin-left:auto;color:var(--blue);font-weight:900}

  main{flex:1;padding:16px 16px 96px}
  main.nopad{padding-bottom:32px}

  /* ── Order tag card ── */
  .tagcard{position:relative;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 2px rgba(11,36,71,.05)}
  .tagcard .hole{position:absolute;top:13px;left:12px;width:12px;height:12px;border:2px solid #B9C9E0;border-radius:99px;background:var(--sky)}
  .tagcard .top{padding:12px 12px 8px 34px;display:flex;justify-content:space-between;gap:8px}
  .perf{border-top:1px dashed #B9C9E0;margin:0 12px}
  .tagcard .bot{padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px}
  .oid{font-size:11px;letter-spacing:.15em;color:#8AA0BC}
  .price{font-weight:800;font-size:14px}
  .stagebar{display:flex;align-items:center;gap:3px;margin:4px 0}
  .dot{width:9px;height:9px;border-radius:99px;background:#D7E3F4;flex:none}
  .dot.on{background:var(--blue)}
  .link{flex:1;height:2px;background:#D7E3F4}
  .link.on{background:var(--blue)}
  .qrbox{display:flex;gap:12px;align-items:center;background:var(--sky);border-radius:10px;padding:10px}
  .qr{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px;flex:none}
  .qr .g{display:grid;grid-template-columns:repeat(9,7px);grid-auto-rows:7px}
  .qr .c{background:var(--navy)}
  .qr .id{font-size:8px;text-align:center;letter-spacing:.15em;margin-top:3px}

  /* ── Stats / bars ── */
  .stat{padding:12px 6px;text-align:center}
  .stat b{font-size:19px;display:block}
  .stat small{font-size:10.5px;color:var(--slate);line-height:1.2;display:block;margin-top:2px}
  .loadbar{height:8px;background:#E4EDF9;border-radius:99px;overflow:hidden}
  .loadbar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
  .loadbar i.hot{background:var(--coral)}
  .chart{display:flex;align-items:flex-end;gap:6px;height:110px}
  .chart .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .chart .bar{width:100%;border-radius:6px 6px 0 0;background:#C6D8F0}
  .chart .bar.today{background:var(--blue)}
  .chart small{font-size:9px;color:var(--slate)}

  /* ── Sub tab strips ── */
  .strip{display:flex;gap:4px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px}
  .strip button{flex:1;padding:7px 4px;border-radius:7px;font-size:12px;font-weight:700;color:var(--slate)}
  .strip button.on{background:var(--blue);color:#fff}

  /* ── Stepper ── */
  .step{display:flex;align-items:center;gap:8px}
  .step button{width:28px;height:28px;border-radius:8px;font-weight:900;font-size:15px}
  .step .minus{border:1px solid var(--line);color:var(--slate)}
  .step .plus{background:var(--blue);color:#fff}
  .step span{width:22px;text-align:center;font-weight:700;font-size:14px}
  .itemrow{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #EDF3FB}
  .itemrow:last-child{border-bottom:none}

  /* ── Bottom nav ── */
  nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--line);display:flex;z-index:50}
  nav.bottom button{flex:1;padding:9px 0 10px;text-align:center;color:#93A6BE}
  nav.bottom button.on{color:var(--blue)}
  nav.bottom .ic{font-size:16px;font-weight:800;line-height:1}
  nav.bottom small{font-size:9.5px;font-weight:700;display:block;margin-top:2px}

  .notif{display:flex;gap:9px;padding:10px 12px;margin-bottom:8px}
  .banner{background:#E4F6EC;border:1px solid #9ED9BC;color:#157347;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
  .task{display:flex;align-items:center;gap:11px;padding:12px;margin-bottom:9px}
  .stopnum{width:32px;height:32px;border-radius:99px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
  .warn{color:var(--coral);font-size:11px;font-weight:700}
</style>
</head>

// ═══ DobiHub · HTML edition · Blue rebrand · Dar es Salaam hero ═══

const REV=[42000,55500,38000,61000,47500,70000];

// ─── State ───────────────────────────────────────────────────────

 lang:"sw", view:"landing", role:null, tab:"dash", ctab:"track", ssub:"pos",

const T=()=>STR[S.lang];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ─── Logic ───────────────────────────────────────────────────────
function total(o){
 const items=(o.items||[]).reduce((s,it)=>{const g=S.garments.find(x=>x.id===it.g);return s+(g?g.price*it.qty:0)},0);
 const base=items+(o.kg||0)*S.rules.perKg;
 return o.express?Math.round(base*(1+S.rules.expressPct/100)):base;
}
function itemsTxt(o){
 const p=(o.items||[]).map(it=>{const g=S.garments.find(x=>x.id===it.g);return it.qty+"× "+(g?g.name[S.lang]:it.g)});
 if(o.kg>0)p.push(o.kg+" "+T().kg);
 return p.join(", ")||"—";
}
function notify(id,stage){
 const msg=S.lang==="sw"?`Oda ${id}: sasa ${SLBL.sw[stage]}. — ${BIZ.name}`:`Order ${id}: now ${SLBL.en[stage]}. — ${BIZ.name}`;
 S.notifs.unshift({text:msg,time:T().justNow,ch:Math.random()>0.5?"wa":"sms"});
}
function setStage(id,st){const o=S.orders.find(x=>x.id===id);if(!o)return;o.stage=st;notify(id,st);render();}
function advance(id){
 const o=S.orders.find(x=>x.id===id);if(!o)return;
 let i=STAGES.indexOf(o.stage),nxt=STAGES[Math.min(i+1,STAGES.length-1)];
 if(nxt==="out"&&!o.delivery)nxt="done";
 setStage(id,nxt);
}
function togglePaid(id){const o=S.orders.find(x=>x.id===id);o.paid=!o.paid;render();}
function pay(id){
 const o=S.orders.find(x=>x.id===id);o.paid=true;
 S.notifs.unshift({text:S.lang==="sw"?`Malipo ya oda ${id} yamepokelewa kwa M-Pesa. Asante!`:`Payment for order ${id} received via M-Pesa. Thank you!`,time:T().justNow,ch:"sms"});
 render();
}
function assign(id,st){const o=S.orders.find(x=>x.id===id);o.staff=st||null;render();}
function qrCells(id){
 let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;
 const a=[];for(let i=0;i<81;i++){h=(h*1103515245+12345)>>>0;a.push((h>>7)%3!==0)}return a;
}
function savePos(){

  <div class="grid2" style="margin-top:10px">
   <div><label class="lbl">${t.pickupDate}</label><select onchange="S.book.date=this.value">
    ${["Leo","Kesho","Keshokutwa"].map(d=>`<option ${f.date===d?"selected":""}>${d}</option>`).join("")}</select></div>
   <div><label class="lbl">${t.pickupSlot}</label><select onchange="S.book.slot=this.value">
    ${["8:00 – 10:00","10:00 – 12:00","14:00 – 16:00","16:00 – 18:00"].map(s=>`<option ${f.slot===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
  <label class="lbl" style="margin-top:10px">${t.garments}</label>
  ${garmentPicker(f.qty,"bookQty",4)}
  <div class="card row" style="justify-content:space-between;padding:10px 12px;margin-top:12px">
   <span class="muted">${t.total}</span><b>${TZS(tot)}</b></div>
  <button class="btn btn-blue" style="margin-top:10px" ${ok?"":"disabled"} onclick="saveBook()">${t.bookBtn}</button>`;
 }
 if(c==="track"){
  const mine=S.orders.filter(o=>o.customer==="Baraka J.");
  body=`<h2 style="font-size:18px;margin-bottom:4px">${t.myOrders}</h2><p class="muted" style="margin-bottom:10px">${t.trackNote}</p>`+
  mine.map(o=>{
   const idx=STAGES.indexOf(o.stage);
   return `<div class="card" style="padding:12px;margin-bottom:10px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
     <div style="min-width:0"><div class="oid mono">${o.id}</div><b style="font-size:13px">${esc(itemsTxt(o))}</b></div>
     <div style="text-align:right;flex:none"><div class="price" style="font-size:13px">${TZS(total(o))}</div>${pill(o.stage)}</div></div>
    <div class="stagebar">${STAGES.map((s,i)=>
     `<div class="dot ${i<=idx?"on":""}"></div>${i<STAGES.length-1?`<div class="link ${i<idx?"on":""}"></div>`:""}`).join("")}</div>
    <div class="row" style="justify-content:space-between;margin-top:4px">
     <span style="font-size:12px;font-weight:700;color:${o.paid?"var(--green)":"var(--rose)"}">${o.paid?"✓ "+t.paid:t.unpaid}</span>
     ${o.paid?"":`<button class="pill" style="background:var(--blue);color:#fff;padding:7px 12px" onclick="pay('${o.id}')">${t.payMpesa} · ${TZS(total(o))}</button>`}
    </div></div>`}).join("");
 }
 if(c==="inbox"){
  body=`<h2 style="font-size:18px;margin-bottom:10px">${t.inbox}</h2>`+
   (S.notifs.length?S.notifs.map(n=>`<div class="card notif"><span>${n.ch==="wa"?"🟢":"✉️"}</span>
    <div><div style="font-size:13px">${esc(n.text)}</div><div class="muted" style="font-size:11px">${n.time} · ${n.ch==="wa"?"WhatsApp":"SMS"}</div></div></div>`).join("")
   :`<p class="muted">${t.noNotifs}</p>`);
 }
 return `<div class="strip">${Object.entries(t.ctabs).map(([id,l])=>
  `<button class="${c===id?"on":""}" onclick="S.ctab='${id}';S.bookedMsg=false;render()">${l}</button>`).join("")}</div>${body}`;
}

function driverApp(){
 const t=T();
 const pick=S.orders.filter(o=>o.stage==="booked").sort((a,b)=>a.dist-b.dist);
 const del=S.orders.filter(o=>o.delivery&&["ready","out"].includes(o.stage)).sort((a,b)=>a.dist-b.dist);
 const task=(o,type,i)=>`<div class="card task">
  <div class="stopnum">${i+1}</div>
  <div style="flex:1;min-width:0"><b style="font-size:13px">${esc(o.customer)}</b> <span class="oid mono">${o.id}</span>
   <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(o.address||"—")} · ${o.dist} km</div>${pill(o.stage)}</div>
  ${type==="p"
   ?`<button class="pill" style="background:var(--blue);color:#fff;padding:9px 10px" onclick="setStage('${o.id}','received')">${t.pickedUp}</button>`
   :`<button class="pill" style="background:var(--blue);color:#fff;padding:9px 10px" onclick="setStage('${o.id}','${o.stage==="ready"?"out":"done"}')">${o.stage==="ready"?"🚚":t.delivered}</button>`}
 </div>`;
 return `<h2 style="font-size:18px;margin-bottom:4px">${t.driver}</h2>
 <p class="muted" style="margin-bottom:10px">${t.routeNote}</p>
 <div class="sec-title">📥 ${t.pickups}</div>
 ${pick.length?pick.map((o,i)=>task(o,"p",i)).join(""):`<p class="muted">${t.noTasks}</p>`}
 <div class="sec-title">📤 ${t.deliveries}</div>
 ${del.length?del.map((o,i)=>task(o,"d",i)).join(""):`<p class="muted">${t.noTasks}</p>`}`;
}

// ─── Root render ─────────────────────────────────────────────────
const ICONS={dash:"◧",orders:"⬡",shop:"⌂",stats:"▤",account:"☰"};
function render(){
 const app=document.getElementById("app"),t=T();
 if(S.view==="landing"){app.innerHTML=landing();window.scrollTo(0,0);return}
 let body,nav="";
 if(S.role==="cust")body=`<main class="nopad">${customerApp()}</main>`;
 else if(S.role==="driver")body=`<main class="nopad">${driverApp()}</main>`;
 else{
  const screen=S.creating?pos():S.tab==="dash"?bizDash():S.tab==="orders"?bizOrders():S.tab==="shop"?shop():S.tab==="stats"?analytics():account();
  body=`<main>${screen}</main>`;
  nav=`<nav class="bottom">${["dash","orders","shop","stats","account"].map(id=>
   `<button class="${S.tab===id&&!S.creating?"on":""}" onclick="S.creating=false;S.tab='${id}';render()">
    <div class="ic">${ICONS[id]}</div><small>${t.tabs[id]}</small></button>`).join("")}</nav>`;
 }
 app.innerHTML=header()+body+nav;
}
render();
</script>
</body>
</html>
